<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle for app shortcut -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle golden ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#fbbf24" stroke-opacity="0.12" stroke-width="3" />

  <!-- Musical Note (Beamed Eighth Notes / Corcheas Unidas) -->
  <g fill="url(#noteGrad)" filter="url(#glow)">
    <!-- Top Beam connecting stems -->
    <polygon points="214,136 374,84 374,130 214,182" />

    <!-- Left Stem -->
    <rect x="214" y="136" width="18" height="206" rx="4" />

    <!-- Right Stem -->
    <rect x="356" y="84" width="18" height="206" rx="4" />

    <!-- Left Note Head (tilted ellipse) -->
    <ellipse cx="184" cy="342" rx="46" ry="32" transform="rotate(-25 184 342)" />

    <!-- Right Note Head (tilted ellipse) -->
    <ellipse cx="326" cy="290" rx="46" ry="32" transform="rotate(-25 326 290)" />
  </g>
</svg>
